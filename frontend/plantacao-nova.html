<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AgroSensor - Nova Plantação</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="h-screen bg-white overflow-hidden">

    <div class="flex h-screen">

        <!-- MENU LATERAL -->
        <aside class="w-[260px] shrink-0 bg-[#6aa86a] flex flex-col justify-between h-screen">

            <div>

                <!-- LOGO -->
                <div class="flex items-center justify-center px-6 py-5">
                    <img src="assets/logo-agrosensor.svg" alt="AgroSensor" class="h-25">
                </div>

                <!-- ITENS DO MENU -->
                <nav class="space-y-1 px-3">

                    <a href="index.html"
                        class="flex items-center gap-3 px-4 py-2.5 rounded-[8px] text-white font-semibold text-[15px] hover:bg-[#5a9c5a] transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="w-5 h-5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955a1.5 1.5 0 012.122 0L22.25 12M4.5 9.75V21a.75.75 0 00.75.75H9.75a.75.75 0 00.75-.75v-4.5a.75.75 0 01.75-.75h1.5a.75.75 0 01.75.75V21a.75.75 0 00.75.75h4.5a.75.75 0 00.75-.75V9.75" />
                        </svg>
                        Dashboard
                    </a>

                    <a href="#"
                        class="flex items-center gap-3 px-4 py-2.5 rounded-[8px] bg-[#5a9c5a] text-white font-bold text-[15px]">
                        <img src="assets/mdi_leaf.svg" alt="Plantações" class="w-5 h-5 brightness-0 invert">
                        Plantações
                    </a>

                    <a href="#"
                        class="flex items-center gap-3 px-4 py-2.5 rounded-[8px] text-white font-semibold text-[15px] hover:bg-[#5a9c5a] transition-colors">
                        <img src="assets/Vector.svg" alt="Sensores" class="w-5 h-5 brightness-0 invert">
                        Sensores
                    </a>

                    <a href="#"
                        class="flex items-center gap-3 px-4 py-2.5 rounded-[8px] text-white font-semibold text-[15px] hover:bg-[#5a9c5a] transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="w-5 h-5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9 17.25v1.007a3 3 0 01-.879 2.122L7.5 21h9l-.621-.621A3 3 0 0115 18.257V17.25m6-12V15a2.25 2.25 0 01-2.25 2.25H5.25A2.25 2.25 0 013 15V5.25m18 0A2.25 2.25 0 0018.75 3H5.25A2.25 2.25 0 003 5.25m18 0V12a2.25 2.25 0 01-2.25 2.25H5.25A2.25 2.25 0 013 12V5.25" />
                        </svg>
                        Dispositivos
                    </a>

                    <a href="#"
                        class="flex items-center gap-3 px-4 py-2.5 rounded-[8px] text-white font-semibold text-[15px] hover:bg-[#5a9c5a] transition-colors">
                        <img src="assets/mdi_bell-alert-outline.svg" alt="Alertas" class="w-5 h-5 brightness-0 invert">
                        Alertas
                    </a>

                </nav>

                <div class="border-t border-white/40 mx-6 my-2"></div>

                <nav class="space-y-1 px-3">

                    <a href="#"
                        class="flex items-center gap-3 px-4 py-2.5 rounded-[8px] text-white font-semibold text-[15px] hover:bg-[#5a9c5a] transition-colors">
                        <img src="assets/LineMdAccount.svg" alt="Perfil" class="w-5 h-5 invert">
                        Perfil
                    </a>

                    <a href="#"
                        class="flex items-center gap-3 px-4 py-2.5 rounded-[8px] text-white font-semibold text-[15px] hover:bg-[#5a9c5a] transition-colors">
                        <img src="assets/line-md_cog.svg" alt="Configurações" class="w-5 h-5 brightness-0 invert">
                        Configurações
                    </a>

                    <a href="#"
                        class="flex items-center gap-3 px-4 py-2.5 rounded-[8px] text-white font-semibold text-[15px] hover:bg-[#5a9c5a] transition-colors">
                        <img src="assets/lineicons_question-mark-circle.svg" alt="Ajuda" class="w-5 h-5 brightness-0 invert">
                        Ajuda
                    </a>

                </nav>

            </div>

            <!-- SAIR -->
            <div class="px-3 pb-5">
                <a href="login.html"
                    class="flex items-center gap-3 px-4 py-2.5 rounded-[8px] text-white font-semibold text-[15px] hover:bg-[#5a9c5a] transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="w-5 h-5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 9V5.25A2.25 2.25 0 0110.5 3h6a2.25 2.25 0 012.25 2.25v13.5A2.25 2.25 0 0116.5 21h-6a2.25 2.25 0 01-2.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75" />
                    </svg>
                    Sair
                </a>
            </div>

        </aside>


        <!-- CONTEÚDO PRINCIPAL -->
        <main class="flex-1 px-8 py-4 overflow-y-auto">

            <!-- CABEÇALHO -->
            <div class="flex items-center justify-between border-b border-gray-200 pb-2">
                <h1 class="text-[26px] font-bold text-black">Nova Plantação</h1>
                <a href="index.html" class="text-gray-400 text-xl hover:text-gray-600">✕</a>
            </div>

            <h2 class="mt-4 text-[18px] font-bold text-green-700">Informações da plantação</h2>


            <!-- FORMULÁRIO -->
            <form class="mt-3 space-y-4 max-w-[900px]">

                <!-- NOME COMPLETO -->
                <div>
                    <label class="block text-[14px] font-semibold text-black mb-1">Nome Completo</label>
                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Ex: Milho Lote A"
                        class="w-full h-[44px] rounded-[8px]
                               border border-[#5f5353]
                               px-4
                               text-[14px] text-black
                               placeholder-[#a0a0a0]
                               focus:outline-none
                               focus:border-[#078607]
                               focus:ring-1
                               focus:ring-[#078607]">
                </div>

                <!-- CULTURA -->
                <div>
                    <label class="block text-[14px] font-semibold text-black mb-1">Cultura</label>
                    <input
                        type="text"
                        id="cultura"
                        name="cultura"
                        placeholder="Informe a cultura"
                        class="w-full h-[44px] rounded-[8px]
                               border border-[#5f5353]
                               px-4
                               text-[14px] text-black
                               placeholder-[#a0a0a0]
                               focus:outline-none
                               focus:border-[#078607]
                               focus:ring-1
                               focus:ring-[#078607]">
                </div>

                <!-- DATAS -->
                <div class="grid grid-cols-2 gap-6">

                    <div>
                        <label class="block text-[14px] font-semibold text-black mb-1">Data início</label>
                        <input
                            type="date"
                            id="dataInicio"
                            name="dataInicio"
                            class="w-full h-[44px] rounded-[8px]
                                   border border-[#5f5353]
                                   px-4
                                   text-[14px] text-black
                                   focus:outline-none
                                   focus:border-[#078607]
                                   focus:ring-1
                                   focus:ring-[#078607]">
                    </div>

                    <div>
                        <label class="block text-[14px] font-semibold text-black mb-1">Data da colheita</label>
                        <input
                            type="date"
                            id="dataColheita"
                            name="dataColheita"
                            class="w-full h-[44px] rounded-[8px]
                                   border border-[#5f5353]
                                   px-4
                                   text-[14px] text-black
                                   focus:outline-none
                                   focus:border-[#078607]
                                   focus:ring-1
                                   focus:ring-[#078607]">
                    </div>

                </div>

                <!-- DESCRIÇÃO -->
                <div>
                    <label class="block text-[14px] font-semibold text-black mb-1">Descrição</label>
                    <textarea
                        id="descricao"
                        name="descricao"
                        rows="4"
                        placeholder="Descrição da plantação..."
                        class="w-full rounded-[8px]
                               border border-[#5f5353]
                               px-4 py-3
                               text-[14px] text-black
                               placeholder-[#a0a0a0]
                               resize-none
                               focus:outline-none
                               focus:border-[#078607]
                               focus:ring-1
                               focus:ring-[#078607]"></textarea>
                </div>

                <!-- DISPOSITIVO -->
                <div>
                    <label class="block text-[14px] font-semibold text-black mb-1">Dispositivo disponível</label>
                    <select
                        id="dispositivo"
                        name="dispositivo"
                        class="w-full h-[44px] rounded-[8px]
                               border border-[#5f5353]
                               px-4
                               text-[14px] text-black
                               focus:outline-none
                               focus:border-[#078607]
                               focus:ring-1
                               focus:ring-[#078607]">
                        <option>Arduino Mega 2560</option>
                        <option>Arduino Uno</option>
                        <option>ESP32</option>
                    </select>
                </div>

                <!-- BOTÃO PRÓXIMO -->
                <div class="flex justify-end pt-2 pb-4">
                    <button
                        type="submit"
                        class="flex items-center gap-2
                               bg-[#078607]
                               text-white
                               font-bold
                               text-[15px]
                               rounded-[8px]
                               px-6 py-3
                               hover:bg-[#067306]
                               transition-colors">
                        Próximo
                        <span>→</span>
                    </button>
                </div>

            </form>

        </main>

    </div>


    <script src="script.js"></script>

</body>

</html>
