<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroSensor - Esqueci minha senha</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="h-screen bg-white overflow-hidden">
    <main class="h-screen flex">

        <section class="w-full md:w-[43%] h-screen flex items-center justify-center px-8">
            <div class="w-full max-w-[480px]">

                <div class="flex items-center gap-2 mb-8">
                    <img src="assets/logo-agrosensor.svg" alt="AgroSensor" class="h-16">
                </div>

                <a href="login.html" class="inline-flex items-center gap-2 text-[16px] text-[#077C07] hover:underline mb-6">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="w-4 h-4">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19 12H5" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 19l-7-7 7-7" />
                    </svg>
                    Voltar para o login
                </a>

                <div class="mb-6">
                    <h1 class="text-[30px] leading-tight font-bold text-black m-0">Esqueci minha senha</h1>
                    <p class="mt-1 text-[17px] text-[#817979]">Digite o seu e-mail cadastrado e nós enviaremos um link para você redefinir sua senha.</p>
                </div>

                <form class="space-y-4">

                    <div class="relative">
                        <span class="absolute left-5 top-1/2 -translate-y-1/2 text-[#5f5959]">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="w-5 h-5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 6.75c0-.828.672-1.5 1.5-1.5h16.5c.828 0 1.5.672 1.5 1.5v10.5a1.5 1.5 0 01-1.5 1.5H3.75a1.5 1.5 0 01-1.5-1.5V6.75z" />
                                <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 6.75l9.75 6.75 9.75-6.75" />
                            </svg>
                        </span>
                        <input type="email" id="email" name="email" placeholder="seu@email.com"
                            class="w-full h-[52px] rounded-[8px] border border-[#5f5353] bg-white pl-12 pr-6 text-[17px] text-[#5f5959] placeholder-[#5f5959] focus:outline-none focus:border-[#077C07] focus:ring-1 focus:ring-[#077C07]">
                    </div>

                    <button type="submit" class="w-full h-[52px] rounded-[8px] bg-[#077C07] text-[18px] font-bold text-white hover:bg-[#067306] transition-colors">
                        Enviar link
                    </button>

                    <a href="login.html" class="block text-center text-[16px] text-[#077C07] hover:underline">
                        Lembrar minha senha
                    </a>

                </form>

                <div class="flex items-start gap-3 border border-[#5f5353]/30 rounded-[8px] px-4 py-3 mt-6">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#077C07" stroke-width="1.5" class="w-5 h-5 flex-shrink-0 mt-0.5">
                        <circle cx="12" cy="12" r="10" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 16v-4" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 8h.01" />
                    </svg>
                    <p class="text-[15px] text-[#817979]">O link para redefinição de senha será enviado para o seu e-mail em até alguns minutos.</p>
                </div>

            </div>
        </section>

        <section class="hidden md:block w-[57%] h-screen bg-cover bg-center" style="background-image: url('assets/campo_esqueci_senha.png');"></section>

    </main>

    <script src="script.js"></script>
</body>
</html>
