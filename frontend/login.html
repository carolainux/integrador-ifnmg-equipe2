<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AgroSensor - Login</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="h-screen bg-white overflow-hidden">

    <main class="h-screen flex">

        <!-- LADO ESQUERDO - FORMULÁRIO -->
        <section class="w-full md:w-[43%] h-screen flex items-center justify-center px-8">

            <div class="w-full max-w-[480px]">

                <!-- LOGO -->
<div class="flex items-center gap-2 mb-8">

    <img src="assets/logo-agrosensor.svg" alt="AgroSensor" class="h-25">


</div>

<!-- TÍTULO -->
<div class="mb-6 text-center -mt-20">

    <h1 class="text-[30px] leading-tight font-bold text-black m-0">
        Bem-vindo de volta!
    </h1>

    <p class="mt-1 text-[17px] text-[#817979]">
        Faça login para continuar
    </p>

</div>

                <!-- FORMULÁRIO -->
                <form class="space-y-4">

                    <!-- EMAIL -->
                    <div class="relative">

                        <span class="absolute left-5 top-1/2 -translate-y-1/2 text-[#5f5959]">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="w-5 h-5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 6.75c0-.828.672-1.5 1.5-1.5h16.5c.828 0 1.5.672 1.5 1.5v10.5a1.5 1.5 0 01-1.5 1.5H3.75a1.5 1.5 0 01-1.5-1.5V6.75z" />
                                <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 6.75l9.75 6.75 9.75-6.75" />
                            </svg>
                        </span>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Email"
                            class="w-full h-[52px] rounded-[8px]
                                   border border-[#5f5353]
                                   bg-white
                                   pl-12 pr-6
                                   text-[17px] text-[#5f5959]
                                   placeholder-[#5f5959]
                                   focus:outline-none
                                   focus:border-[#078607]
                                   focus:ring-1
                                   focus:ring-[#078607]">

                    </div>


                    <!-- SENHA -->
                    <div class="relative">

                        <span class="absolute left-5 top-1/2 -translate-y-1/2 text-[#5f5959]">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="w-5 h-5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a1.5 1.5 0 001.5-1.5v-8.25a1.5 1.5 0 00-1.5-1.5H6.75a1.5 1.5 0 00-1.5 1.5v8.25a1.5 1.5 0 001.5 1.5z" />
                            </svg>
                        </span>

                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Senha"
                            class="w-full h-[52px] rounded-[8px]
                                   border border-[#5f5353]
                                   bg-white
                                   pl-12 pr-14
                                   text-[17px] text-[#5f5959]
                                   placeholder-[#5f5959]
                                   focus:outline-none
                                   focus:border-[#078607]
                                   focus:ring-1
                                   focus:ring-[#078607]">

                        <button
                            type="button"
                            onclick="mostrarSenha('senha', 'iconeSenha')"
                            class="absolute right-5 top-1/2 -translate-y-1/2">

                            <svg
                                id="iconeSenha"
                                xmlns="http://www.w3.org/2000/svg"
                                fill="none"
                                viewBox="0 0 24 24"
                                stroke-width="1.5"
                                stroke="currentColor"
                                class="w-6 h-6 text-black">

                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />

                            </svg>

                        </button>

                    </div>


                    <!-- LEMBRAR / ESQUECI -->
                    <div class="flex items-center justify-between">

                        <div class="flex items-center gap-2">

                            <input
                                type="checkbox"
                                id="lembrar"
                                name="lembrar"
                                class="w-4 h-4 rounded border-[#5f5353]
                                       accent-[#078607]">

                            <label
                                for="lembrar"
                                class="text-[16px] text-[#817979]">
                                Lembrar acesso
                            </label>

                        </div>

                        
                           <a href="#"
                            class="text-[16px] text-[#078607] hover:underline">
                            Esqueci minha senha
                        </a>

                    </div>


                    <!-- BOTÃO -->
                    <button
                        type="submit"
                        class="w-full h-[52px]
                               rounded-[8px]
                               bg-[#078607]
                               text-[18px]
                               font-bold
                               text-white
                               hover:bg-[#067306]
                               transition-colors">

                        Entrar

                    </button>

                </form>


                <!-- CADASTRO -->
                <p class="mt-5 text-center text-[16px] text-[#817979]">
                    Não tem uma conta?
                    <a href="cadastro.html" class="text-[#078607] hover:underline">
                        Cadastre-se
                    </a>
                </p>

            </div>

        </section>


        <!-- LADO DIREITO - IMAGEM -->
        <section
            class="hidden md:block w-[57%] h-screen bg-cover bg-center"
            style="background-image: url('assets/campo_criar_conta.png');">
        </section>

    </main>


    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>

</html>
