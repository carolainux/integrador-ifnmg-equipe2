<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AgroSensor - Criar sua conta</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="h-screen bg-white overflow-hidden">

    <main class="h-screen flex">

        <!-- LADO ESQUERDO - IMAGEM -->
        <section
            class="hidden md:block w-[43%] h-screen bg-cover bg-center"
            style="background-image: url('assets/campo_criar_conta.png');">
        </section>


        <!-- LADO DIREITO - FORMULÁRIO -->
        <section class="w-full md:w-[57%] h-screen flex items-center justify-center px-8">

            <div class="w-full max-w-[520px]">

                <!-- TÍTULO -->
                <div class="mb-6">

                    <h1 class="text-[32px] leading-tight font-bold text-black">
                        Criar sua conta
                    </h1>

                    <p class="mt-1 text-[18px] text-[#817979]">
                        Preencha os dados abaixo
                    </p>

                </div>


                <!-- FORMULÁRIO -->
                <form class="space-y-5">

                    <!-- NOME -->
                    <div>

                        <input
                            type="text"
                            id="nome"
                            name="nome"
                            placeholder="Nome completo"
                            class="w-full h-[52px] rounded-[8px]
                                   border border-[#5f5353]
                                   bg-white
                                   px-6
                                   text-[17px] text-[#5f5959]
                                   placeholder-[#5f5959]
                                   focus:outline-none
                                   focus:border-[#078607]
                                   focus:ring-1
                                   focus:ring-[#078607]">

                    </div>


                    <!-- EMAIL -->
                    <div>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Email"
                            class="w-full h-[52px] rounded-[8px]
                                   border border-[#5f5353]
                                   bg-white
                                   px-6
                                   text-[17px] text-[#5f5959]
                                   placeholder-[#5f5959]
                                   focus:outline-none
                                   focus:border-[#078607]
                                   focus:ring-1
                                   focus:ring-[#078607]">

                    </div>


                    <!-- TELEFONE -->
                    <div>

                        <input
                            type="tel"
                            id="telefone"
                            name="telefone"
                            placeholder="Telefone"
                            class="w-full h-[52px] rounded-[8px]
                                   border border-[#5f5353]
                                   bg-white
                                   px-6
                                   text-[17px] text-[#5f5959]
                                   placeholder-[#5f5959]
                                   focus:outline-none
                                   focus:border-[#078607]
                                   focus:ring-1
                                   focus:ring-[#078607]">

                    </div>


                    <!-- SENHA -->
                    <div class="relative">

                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Senha"
                            class="w-full h-[52px] rounded-[8px]
                                   border border-[#5f5353]
                                   bg-white
                                   px-6 pr-14
                                   text-[17px] text-[#5f5959]
                                   placeholder-[#5f5959]
                                   focus:outline-none
                                   focus:border-[#078607]
                                   focus:ring-1
                                   focus:ring-[#078607]">

                        <button
                            type="button"
                            onclick="mostrarSenha('senha', 'iconeSenha')"
                            class="absolute right-5 top-1/2 -translate-y-1/2">

                            <svg
                                id="iconeSenha"
                                xmlns="http://www.w3.org/2000/svg"
                                fill="none"
                                viewBox="0 0 24 24"
                                stroke-width="1.5"
                                stroke="currentColor"
                                class="w-6 h-6 text-black">

                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />

                            </svg>

                        </button>

                    </div>


                    <!-- CONFIRMAR SENHA -->
                    <div class="relative">

                        <input
                            type="password"
                            id="confirmarSenha"
                            name="confirmarSenha"
                            placeholder="Confirmar Senha"
                            class="w-full h-[52px] rounded-[8px]
                                   border border-[#5f5353]
                                   bg-white
                                   px-6 pr-14
                                   text-[17px] text-[#5f5959]
                                   placeholder-[#5f5959]
                                   focus:outline-none
                                   focus:border-[#078607]
                                   focus:ring-1
                                   focus:ring-[#078607]">

                        <button
                            type="button"
                            onclick="mostrarSenha('confirmarSenha', 'iconeConfirmarSenha')"
                            class="absolute right-5 top-1/2 -translate-y-1/2">

                            <svg
                                id="iconeConfirmarSenha"
                                xmlns="http://www.w3.org/2000/svg"
                                fill="none"
                                viewBox="0 0 24 24"
                                stroke-width="1.5"
                                stroke="currentColor"
                                class="w-6 h-6 text-black">

                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />

                            </svg>

                        </button>

                    </div>


                    <!-- TERMOS -->
                    <div class="flex items-center gap-2">

                        <input
                            type="checkbox"
                            id="termos"
                            name="termos"
                            class="w-4 h-4 rounded border-[#5f5353]
                                   accent-[#078607]">

                        <label
                            for="termos"
                            class="text-[16px] text-[#817979]">

                            Li e aceito os
                            
                                <a href="#"
                                class="text-[#078607] hover:underline">
                                termos de uso
                            </a>

                        </label>

                    </div>


                    <!-- BOTÃO -->
                    <button
                        type="submit"
                        class="w-full h-[52px]
                               rounded-[8px]
                               bg-[#078607]
                               text-[18px]
                               font-bold
                               text-white
                               hover:bg-[#067306]
                               transition-colors">

                        Criar conta

                    </button>

                </form>


                <!-- LOGIN -->
                <p class="mt-5 text-center text-[16px] text-[#817979]">
                    Já tem uma conta?
                    <a href="login.html" class="text-[#078607] hover:underline">
                        Faça login
                    </a>
                </p>

            </div>

        </section>

    </main>


    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>

</html>
