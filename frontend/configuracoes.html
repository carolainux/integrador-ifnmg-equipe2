        <!-- ITENS DO MENU -->
        <nav class="space-y-1 px-3">

          <a href="index.html"

          <a href="plantacoes.html"

          <a href="sensores.html"

            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-5 h-5">

          <a href="dispositivos.html"
             class="flex items-center gap-3 px-4 py-2.5 rounded-[8px] text-white font-semibold hover:bg-[#5a9c5a] transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-5 h-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 17.25v1.007a3 3 0 01-.879 2.122L7.5 21h9l-.621-.621A3 3 0 0115 18.257V17.25m6-12V15a2.25 2.25 0 01-2.25 2.25H5.25A2.25 2.25 0 013 15V5.25m18 0A2.25 2.25 0 0018.75 3H5.25A2.25 2.25 0 003 5.25m18 0V12a2.25 2.25 0 01-2.25 2.25H5.25A2.25 2.25 0 013 12V5.25" />
            </svg>
            Dispositivos
          </a>

          <a href="alertas.html"
             class="flex items-center gap-3 px-4 py-2.5 rounded-[8px] text-white font-semibold hover:bg-[#5a9c5a] transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-5 h-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0" />
            </svg>
            Alertas
          </a>

          <a href="perfil.html"
             class="flex items-center gap-3 px-4 py-2.5 rounded-[8px] text-white font-semibold hover:bg-[#5a9c5a] transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-5 h-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
            </svg>
            Perfil
          </a>

          <a href="configuracoes.html"
             class="flex items-center gap-3 px-4 py-2.5 rounded-[8px] bg-[#5a9c5a] text-white font-semibold">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-5 h-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.24-.438.613-.431.992a6.759 6.759 0 010 .255c-.007.378.138.75.43.99l1.005.828c.424.35.534.954.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.57 6.57 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.28c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.02-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.992a6.932 6.932 0 010-.255c.007-.378-.138-.75-.43-.99l-1.004-.828a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.281z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
            Configurações
          </a>

          <a href="ajuda.html"
             class="flex items-center gap-3 px-4 py-2.5 rounded-[8px] text-white font-semibold hover:bg-[#5a9c5a] transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-5 h-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9.879 7.519c1.171-1.025 3.071-1.025 4.242 0 1.172 1.025 1.172 2.687 0 3.712-.203.179-.43.326-.67.442-.745.361-1.45.999-1.45 1.827v.75M12 18h.008v.008H12V18z" /><path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            Ajuda
          </a>

        </nav>
      </div>

      <!-- SAIR -->
      <div class="px-3 pb-8">
        <a href="login.html"
           class="flex items-center gap-3 px-4 py-2.5 rounded-[8px] text-white font-semibold hover:bg-[#5a9c5a] transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l3 3m0 0l-3 3m3-3H3" />
          </svg>
          Sair
        </a>
      </div>
    </aside>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="flex-1 flex flex-col p-8 overflow-y-auto">

      <!-- CABEÇALHO -->
      <div class="flex items-start justify-between mb-6">
        <div>
          <h1 class="text-2xl font-bold text-gray-900">Configurações</h1>
          <p class="text-gray-500 text-sm mt-1">Personalize a plataforma</p>
        </div>
        <a href="index.html" class="text-gray-400 hover:text-gray-600 text-2xl leading-none">&times;</a>
      </div>

      <!-- APARÊNCIA -->
      <div class="border border-gray-200 rounded-[10px] px-5 py-4 mb-4">
        <h2 class="text-base font-bold text-gray-900 mb-3">Aparência</h2>
        <div class="grid grid-cols-2 gap-4">

          <label class="relative flex flex-col items-center justify-center gap-2 border-2 border-[#077C07] bg-green-50 rounded-[10px] py-6 cursor-pointer">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-6 h-6 text-yellow-500">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" />
            </svg>
            <span class="text-sm font-medium text-gray-700">Tema Claro</span>
            <input type="radio" name="tema" checked class="sr-only" />
            <div class="w-9 h-5 rounded-full bg-[#077C07] flex items-center px-0.5 justify-end">
              <div class="w-4 h-4 rounded-full bg-white"></div>
            </div>
          </label>

          <label class="relative flex flex-col items-center justify-center gap-2 border border-gray-200 rounded-[10px] py-6 cursor-pointer hover:bg-gray-50">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-6 h-6 text-gray-700">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" />
            </svg>
            <span class="text-sm font-medium text-gray-700">Tema Escuro</span>
            <input type="radio" name="tema" class="sr-only" />
            <div class="w-9 h-5 rounded-full bg-gray-300 flex items-center px-0.5">
              <div class="w-4 h-4 rounded-full bg-white"></div>
            </div>
          </label>

        </div>
      </div>

      <!-- IDIOMA -->
      <div class="border border-gray-200 rounded-[10px] px-5 py-4 mb-4">
        <h2 class="text-base font-bold text-gray-900 mb-3">Idioma</h2>
        <div class="relative">
          <select class="w-full appearance-none border border-gray-300 rounded-[8px] px-4 py-2.5 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-[#077C07]">
            <option>Português (Brasil)</option>
            <option>English</option>
            <option>Español</option>
          </select>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               class="w-4 h-4 absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
          </svg>
        </div>
      </div>

      <!-- NOTIFICAÇÕES -->
      <div class="border border-gray-200 rounded-[10px] px-5 py-4 mb-4">
        <h2 class="text-base font-bold text-gray-900 mb-3">Notificações</h2>
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-[8px] bg-green-50 flex items-center justify-center text-lg">💬</div>
            <div>
              <p class="text-sm font-semibold text-gray-900">WhatsApp</p>
              <p class="text-xs text-gray-500">Alertas via whatsapp</p>
            </div>
          </div>
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" checked class="sr-only peer" />
            <div class="w-11 h-6 bg-gray-300 rounded-full peer peer-checked:bg-[#077C07] transition-colors"></div>
            <div class="absolute left-1 top-1 w-4 h-4 bg-white rounded-full transition-transform peer-checked:translate-x-5"></div>
          </label>
        </div>
      </div>

      <!-- ATUALIZAÇÕES DE DADOS -->
      <div class="border border-gray-200 rounded-[10px] px-5 py-4 mb-6">
        <h2 class="text-base font-bold text-gray-900 mb-3">Atualizações de Dados</h2>
        <div class="grid grid-cols-2 gap-y-3">
          <label class="flex items-center gap-2 text-sm text-gray-700 cursor-pointer">
            <input type="radio" name="atualizacao" class="w-4 h-4 accent-[#077C07]" />
            A cada 5 minutos
          </label>
          <label class="flex items-center gap-2 text-sm text-gray-700 cursor-pointer">
            <input type="radio" name="atualizacao" class="w-4 h-4 accent-[#077C07]" />
            A cada 15 minutos
          </label>
          <label class="flex items-center gap-2 text-sm text-gray-700 cursor-pointer">
            <input type="radio" name="atualizacao" checked class="w-4 h-4 accent-[#077C07]" />
            A cada 30 minutos
          </label>
          <label class="flex items-center gap-2 text-sm text-gray-700 cursor-pointer">
            <input type="radio" name="atualizacao" class="w-4 h-4 accent-[#077C07]" />
            A cada 1 hora
          </label>
        </div>
      </div>

      <!-- AÇÕES -->
      <div class="flex items-center justify-between">
        <a href="index.html"
           class="border border-gray-300 rounded-[8px] px-6 py-2.5 text-sm font-medium text-gray-700 hover:bg-gray-50 transition-colors">
          Voltar
        </a>
        <button class="bg-[#077C07] hover:bg-[#067306] text-white font-semibold px-6 py-2.5 rounded-[8px] transition-colors">
          Salvar Configurações
        </button>
      </div>

    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
